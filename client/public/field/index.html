function metrics(s,r){let obs=[['Total distance',r?.d.toFixed(2)+' km'],['Estimated EVA time',r?.time+' min'],['Maximum slope',r?.peak.toFixed(1)+'°'],['Average slope',r?.avg.toFixed(1)+'°'],['Elevation gain','+'+Math.round(r?.rise)+' m'],['Elevation loss','−'+Math.round(r?.loss)+' m'],['Hazard count',''+r?.h],['Safety score',r?.score+' / 100']];let o=card(40,980,500,418)+txt(62,1021,'Route metrics',23,C.text,650)+txt(518,1020,r?r.cl:'Awaiting route',15,r?.cl==='High Risk'?C.red:r?.cl==='Caution'?C.gold:C.green,600,false,'end')+line(62,1040,518,1040);obs.forEach(([l,v],i)=>{let x=62+(i%2)*238,y=1071+Math.floor(i/2)*79;o+=txt(x,y,l,14,C.muted)+txt(x,y+34,r?v:'—',23,C.text,550,true)});return g('Route-metrics',o)}
const chart={x:615,y:1092,w:433,h:205};function chartData(r){let heights=r.heights??r.pts.map(p=>z(...p)),low=Math.floor(Math.min(...heights)/50)*50,high=Math.max(low+50,Math.ceil(Math.max(...heights)/50)*50),topSlope=Math.max(20,Math.ceil(Math.max(...r.sl)/10)*10),xs=r.km.map(d=>chart.x+chart.w*(r.d?d/r.d:0));return {xs,low,high,topSlope,el:heights.map((h,i)=>[xs[i],chart.y+chart.h*(high-h)/(high-low)]),sl:r.sl.map((a,i)=>[xs[i],chart.y+chart.h*(1-a/topSlope)])}}

for(let i=1;i<r.pts.length;i++)if(r.sl[i]>s.max)o+=rect(c.xs[i-1],chart.y,c.xs[i]-c.xs[i-1]+.2,chart.h,'#593B35');
o+=path(dp(c.el)+'L'+fmt([c.xs.at(-1),chart.y+chart.h])+'L'+fmt([chart.x,chart.y+chart.h])+'Z','none',0,'#704B38','opacity=".65"')+path(dp(c.el),C.cyan,2.6)+path(dp(c.sl),C.gold,1.7,'none','stroke-dasharray="5 3"')+txt(833,1347,'Distance along route (km)',13,C.muted,400,false,'middle');
let h=s.hover;if(h!==null){o+=line(c.xs[h],chart.y,c.xs[h],chart.y+chart.h,C.text,1.2)+circle(...c.el[h],4,C.cyan,C.bg)+circle(...c.sl[h],3,C.gold,C.bg)}
o+=txt(580,1380,h===null?'Inspect profile to locate a point on the map':r.km[h].toFixed(2)+' km    '+Math.round(r.heights?.[h]??z(...r.pts[h]))+' m    '+r.sl[h].toFixed(1)+'° slope',14,h===null?C.muted:C.cyan);return g('Elevation-and-slope',o)}
function alerts(s,r){let flags=[['Slope exceeds safe limit',r&&r.peak>s.max],['Sand dune detected',r&&r.pts.some(p=>Math.hypot((p[0]-.68)*1.8,p[1]-.81)<.11)],['Communication loss risk',r&&r.h>1],['Radiation exposure warning',surfaceData?.rad?.solar_particle_event_alert===true],['Route passes near scientific target',r&&r.pts.some(p=>pois.slice(1).some(t=>Math.hypot(t.x-p[0],t.y-p[1])<.06))],['Insufficient life support margin',r&&r.time>150]];let o=card(1144,980,496,418)+txt(1166,1021,'Hazard alerts',23,C.text,650)+txt(1617,1020,r?flags.filter(a=>a[1]).length+' active':'Awaiting route',14,C.gold,500,false,'end')+line(1166,1040,1618,1040);flags.forEach(([l,on],i)=>{let y=1070+i*45,col=on?(i===4?C.cyan:C.gold):C.faint;o+=circle(1173,y-4,4,on?col:'none',col,1.2)+txt(1190,y,l,14,on?C.text:C.muted,on?550:400)+txt(1615,y,on?(i===4?'INFO':'ALERT'):(r?(i===3?'NO DATA':'CLEAR'):'—'),12,col,600,true,'end')+line(1166,y+14,1618,y+14)});o+=txt(1166,1375,'Scenario indicators · simulated conditions',13,C.muted);return g('Hazard-alerts',o)}

</script><script src="field-model.js"></script><script>let state=baseState();const host=document.getElementById('preview');
const draw=()=>{host.innerHTML=screen(state);host.querySelectorAll('.action').forEach(el=>{el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',el.textContent.trim())})};
const coord=e=>{let svg=host.querySelector('svg'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function setPoint(which,p,n){state[which]=p;state[which+'n']=n;state.selecting=null;state.computed=false;state.hover=null}
function act(id,e){const oldKey=routeKey();if(id.startsWith('layer')){state.layers[+id.slice(5)]=!state.layers[+id.slice(5)]}else if(id.startsWith('mode')){state.active=+id.slice(4);state.hover=null}else if(id==='picka'||id==='pickb'){state.selecting=id.slice(-1)}else if(id.startsWith('preset')){let w=waypoints[+id.slice(6)];setPoint(state.selecting||(!state.a?'a':'b'),[...w.p],w.n)}else if(id==='map-target'){let p=coord(e),xy=[(p.x-map.x)/map.w,(p.y-map.y)/map.h];let k=state.selecting||(!state.a?'a':'b');setPoint(k,xy,'Map point · '+xy.map(t=>t.toFixed(3)).join(', '))}else if(id==='minus'||id==='plus'){state.max=Math.max(2,Math.min(45,state.max+(id==='plus'?1:-1)));state.hover=null}else if(id==='compute'){if(!state.a||!state.b){state.selecting=!state.a?'a':'b'}else if(Math.hypot(state.a[0]-state.b[0],state.a[1]-state.b[1])<.001){state.selecting='b';state.bn='Pick a different target'}else{state.computed=true;state.hover=null;state.selecting=null}}else if(id==='clear'){state.computed=false;state.a=null;state.b=null;state.an='Choose a start';state.bn='Choose a target';state.selecting='a';state.hover=null}else{return}if(oldKey!==routeKey()){generation++;modelRoutes=null;modelStatus="Fallback"}draw();if(id==="compute"&&state.computed)computeModel()}
host.addEventListener('click',e=>{let n=e.target.closest('.action,#map-target');if(n)act(n.id,e)});
host.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.classList.contains('action')){e.preventDefault();let id=e.target.id;act(id,e);document.getElementById(id)?.focus()}});
function hover(n){if(state.hover===n)return;state.hover=n;let rs=[0,1,2].map(i=>route(state,i)),r=rs[state.active];document.getElementById('Route-overlay').innerHTML=routesOnMap(state,rs);document.getElementById('Elevation-and-slope').outerHTML=profile(state,r)}
host.addEventListener('pointermove',e=>{if(!state.computed)return;if(e.target.closest('#profile-hit')){let p=coord(e),r=route(state,state.active),d=r.d*Math.max(0,Math.min(1,(p.x-chart.x)/chart.w));let n=r.km.findIndex(v=>v>=d);hover(n<0?r.pts.length-1:n)}else if(state.hover!==null)hover(null)});host.addEventListener('pointerleave',()=>{if(state.computed&&state.hover!==null)hover(null)});draw()
